# Producción Dokploy: Docker Compose (no Docker Stack).
# TLS en Traefik; sin puertos publicados. Ver AUDITORIA_DOKPLOY.md.
# Defaults de secretos SOLO para desarrollo; configurar valores propios en Dokploy.
# Los digests fijan las imágenes inspeccionadas; validar arquitectura del VPS.

x-db-env: &db-env
  PGHOST: plane-db
  PGDATABASE: plane
  POSTGRES_USER: plane
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plane-local-dev}
  POSTGRES_DB: plane
  POSTGRES_PORT: "5432"
  PGDATA: /var/lib/postgresql/data

x-redis-env: &redis-env
  REDIS_HOST: plane-redis
  REDIS_PORT: "6379"
  REDIS_URL: redis://plane-redis:6379/

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-plane-storage}
  MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-plane-storage-local-dev}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-plane-storage}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-plane-storage-local-dev}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}

x-proxy-env: &proxy-env
  APP_DOMAIN: ${PLANE_DOMAIN:-localhost}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-10485760}
  BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  SITE_ADDRESS: ":80"

x-mq-env: &mq-env
  RABBITMQ_HOST: plane-mq
  RABBITMQ_PORT: "5672"
  RABBITMQ_DEFAULT_USER: plane
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane-local-dev}
  RABBITMQ_DEFAULT_VHOST: plane
  RABBITMQ_VHOST: plane

x-live-env: &live-env
  API_BASE_URL: ${API_BASE_URL:-http://api:8000}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:-local-dev-live-secret-change-in-production}

x-auth-env: &auth-env
  ENABLE_EMAIL_PASSWORD: "1"
  ENABLE_SIGNUP: "1"

x-app-env: &app-env
  <<: *auth-env
  # Plane conserva opciones existentes en InstanceConfiguration (God Mode).
  # Estas variables inicializan instancias nuevas; no sobrescriben su base de datos.
  WEB_URL: ${WEB_URL:-https://${PLANE_DOMAIN:-localhost}}
  DEBUG: "0"
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${PLANE_DOMAIN:-localhost},https://${TICKETS_DOMAIN:-tickets.localhost}}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
  USE_MINIO: "1"
  DATABASE_URL: postgresql://plane:${POSTGRES_PASSWORD:-plane-local-dev}@plane-db:5432/plane
  SECRET_KEY: ${SECRET_KEY:-local-dev-django-secret-change-in-production}
  AMQP_URL: amqp://plane:${RABBITMQ_PASSWORD:-plane-local-dev}@plane-mq:5672/plane
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  MINIO_ENDPOINT_SSL: "0"
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:-local-dev-live-secret-change-in-production}
  WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}

x-runtime: &runtime
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  labels:
    traefik.enable: "false"

services:
  # ---------------------------------------------------------------------------
  # Plane — datos
  # ---------------------------------------------------------------------------
  plane-db:
    <<: *runtime
    image: postgres@sha256:468d34fefd6338031787c7b8e94078975b3aaf4d66c7ead25c39cd3ba46a15c6
    restart: unless-stopped
    environment:
      <<: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - tickets-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plane -d plane"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  plane-redis:
    <<: *runtime
    image: valkey/valkey@sha256:10328d00120dc14fbc87b2ed61b7677ddbb0d011e705361b4788329a0ec69a93
    command: valkey-server --appendonly yes
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - tickets-net
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  plane-mq:
    <<: *runtime
    hostname: plane-mq
    image: rabbitmq@sha256:611107e29cce05c2acd968325d5dcbde7e2fee404970f1ead75fdb22be2821b3
    restart: unless-stopped
    environment:
      <<: *mq-env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - tickets-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  plane-minio:
    <<: *runtime
    image: pgsty/silo@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    restart: unless-stopped
    command: server /export --console-address ":9090"
    environment:
      <<: *minio-env
    volumes:
      - uploads:/export
    networks:
      - tickets-net

  # ---------------------------------------------------------------------------
  # Plane — aplicación (imágenes oficiales Community)
  # ---------------------------------------------------------------------------
  migrator:
    <<: *runtime
    image: makeplane/plane-backend@sha256:90032ce088708889b60c00d491897916f4deb882facda27db59fd10fb68729ef
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    volumes:
      - logs_migrator:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
    networks:
      - tickets-net

  api:
    <<: *runtime
    image: makeplane/plane-backend@sha256:90032ce088708889b60c00d491897916f4deb882facda27db59fd10fb68729ef
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api.sh
    volumes:
      - logs_api:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - tickets-net
      - egress
      - dokploy-network
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/instances/', timeout=5)",
        ]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s

  worker:
    <<: *runtime
    image: makeplane/plane-backend@sha256:90032ce088708889b60c00d491897916f4deb882facda27db59fd10fb68729ef
    restart: unless-stopped
    command: ./bin/docker-entrypoint-worker.sh
    volumes:
      - logs_worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      api:
        condition: service_healthy
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
    networks:
      - tickets-net
      - egress

  beat-worker:
    <<: *runtime
    image: makeplane/plane-backend@sha256:90032ce088708889b60c00d491897916f4deb882facda27db59fd10fb68729ef
    restart: unless-stopped
    command: ./bin/docker-entrypoint-beat.sh
    volumes:
      - logs_beat-worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      api:
        condition: service_healthy
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
    networks:
      - tickets-net
      - egress

  web:
    <<: *runtime
    image: makeplane/plane-frontend@sha256:22fd2434fb8d6658439f669ab72f999ce0773abe587663da21a77d70bd63ff61
    restart: unless-stopped
    environment:
      <<: *auth-env
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    networks:
      - tickets-net
      - dokploy-network

  space:
    <<: *runtime
    image: makeplane/plane-space@sha256:f8f842f05f41a16e9fe8c4f5e17a3bb175338ccdc094620e58ae49764ffbd671
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - tickets-net

  admin:
    <<: *runtime
    image: makeplane/plane-admin@sha256:6e1bb1d800d3c7ce84a09f810d5588db8613b35d4464e722a1bec12556ca0ebb
    restart: unless-stopped
    environment:
      <<: *auth-env
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - tickets-net
      - dokploy-network

  live:
    <<: *runtime
    image: makeplane/plane-live@sha256:cbb630ccaea24bb9998040cb45c11619a7501e8b6c75d449df2f8fd9b9cddbd0
    restart: unless-stopped
    environment:
      <<: [*live-env, *redis-env]
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - tickets-net

  proxy:
    <<: *runtime
    image: makeplane/plane-proxy@sha256:47e651c56749c287710cc26f82dc5d1046a2af76a332aa048ab7adb881cc4cd0
    restart: unless-stopped
    environment:
      <<: *proxy-env
    volumes:
      - proxy_config:/config
      - proxy_data:/data
    # Las imagenes fijadas de web/space/admin incluyen healthcheck HTTP en :3000.
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      space:
        condition: service_healthy
      admin:
        condition: service_healthy
      live:
        condition: service_started
    networks:
      - tickets-net
      - dokploy-network

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.${ROUTER_PREFIX:-crs-tickets}-proxy.rule=Host(`${PLANE_DOMAIN:-localhost}`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-crs-tickets}-proxy.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-crs-tickets}-proxy.tls=true"
      - "traefik.http.routers.${ROUTER_PREFIX:-crs-tickets}-proxy.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${ROUTER_PREFIX:-crs-tickets}-proxy.service=${ROUTER_PREFIX:-crs-tickets}-proxy"
      - "traefik.http.services.${ROUTER_PREFIX:-crs-tickets}-proxy.loadbalancer.server.port=80"
      - "traefik.http.routers.${ROUTER_PREFIX:-crs-tickets}-proxy-http.rule=Host(`${PLANE_DOMAIN:-localhost}`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-crs-tickets}-proxy-http.entrypoints=web"
      - "traefik.http.routers.${ROUTER_PREFIX:-crs-tickets}-proxy-http.service=${ROUTER_PREFIX:-crs-tickets}-proxy"
      - "traefik.http.routers.${ROUTER_PREFIX:-crs-tickets}-proxy-http.middlewares=${ROUTER_PREFIX:-crs-tickets}-proxy-https"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-crs-tickets}-proxy-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-crs-tickets}-proxy-https.redirectscheme.permanent=true"

  plane-mcp:
    <<: *runtime
    labels: {traefik.enable: "true"}
    build:
      context: ./plane-mcp-server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "8211"
      LOG_LEVEL: ${MCP_LOG_LEVEL:-info}
      LOG_PAYLOADS: ${MCP_LOG_PAYLOADS:-false}
      # Pública o canónica (Dokploy). Si solo usas API key interna, puede ser http://api:8000
      PLANE_BASE_URL: ${PLANE_BASE_URL:-http://api:8000}
      # Llamadas API container→container (preferido)
      PLANE_INTERNAL_BASE_URL: ${PLANE_INTERNAL_BASE_URL:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8211"
    networks:
      - tickets-net
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 5

  # ---------------------------------------------------------------------------
  # Floci — S3 local persistente (adjuntos del formulario)
  # ---------------------------------------------------------------------------
  floci:
    <<: *runtime
    image: floci/floci@sha256:e0b292df4dc9559b7b1bf4f51bdda4bb8e269276236438cd03cae661260ea8a9
    restart: unless-stopped
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_BASE_URL: http://floci:4566
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    volumes:
      - floci-data:/app/data
    expose:
      - "4566"
    networks:
      - tickets-net

  # ---------------------------------------------------------------------------
  # floci-tickets (Nuevo Ticket) — form + MCP + Floci + Plane
  # ---------------------------------------------------------------------------
  floci-tickets:
    <<: *runtime
    build:
      context: ./nuevo-ticket
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "5179"
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-session-secret-change-in-production}
      # Proxy interno: enruta tanto /api como URLs firmadas /uploads
      PLANE_API_URL: http://proxy:80
      # Público: URL que abre el usuario en el navegador (dominio Dokploy de Plane)
      PLANE_WEB_URL: ${PLANE_WEB_URL:-https://${PLANE_DOMAIN:-localhost}}
      PLANE_WORKSPACE_SLUG: ${PLANE_WORKSPACE_SLUG:-crs}
      # Interno: MCP en la misma red
      PLANE_MCP_URL: ${PLANE_MCP_URL:-http://plane-mcp:8211/http/api-key/mcp}
      PLANE_MCP_API_KEY: ${PLANE_MCP_API_KEY:-BOOTSTRAP_NOT_A_REAL_TOKEN}
      # Interno: Floci (forzado; no uses localhost)
      FLOCI_ENDPOINT: http://floci:4566
      FLOCI_BUCKET: ${FLOCI_BUCKET:-tickets}
      AWS_REGION: ${FLOCI_AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${FLOCI_AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${FLOCI_AWS_SECRET_ACCESS_KEY:-test}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-auto}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      TICKETS_PUBLIC_URL: ${TICKETS_PUBLIC_URL:-https://${TICKETS_DOMAIN:-tickets.localhost}}
    depends_on:
      proxy:
        condition: service_started
      api:
        condition: service_healthy
      plane-mcp:
        condition: service_healthy
      floci:
        condition: service_started
    expose:
      - "5179"
    networks:
      - tickets-net
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.${ROUTER_PREFIX:-crs-tickets}-floci-tickets.rule=Host(`${TICKETS_DOMAIN:-tickets.localhost}`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-crs-tickets}-floci-tickets.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-crs-tickets}-floci-tickets.tls=true"
      - "traefik.http.routers.${ROUTER_PREFIX:-crs-tickets}-floci-tickets.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${ROUTER_PREFIX:-crs-tickets}-floci-tickets.service=${ROUTER_PREFIX:-crs-tickets}-floci-tickets"
      - "traefik.http.services.${ROUTER_PREFIX:-crs-tickets}-floci-tickets.loadbalancer.server.port=5179"
      - "traefik.http.routers.${ROUTER_PREFIX:-crs-tickets}-floci-tickets-http.rule=Host(`${TICKETS_DOMAIN:-tickets.localhost}`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-crs-tickets}-floci-tickets-http.entrypoints=web"
      - "traefik.http.routers.${ROUTER_PREFIX:-crs-tickets}-floci-tickets-http.service=${ROUTER_PREFIX:-crs-tickets}-floci-tickets"
      - "traefik.http.routers.${ROUTER_PREFIX:-crs-tickets}-floci-tickets-http.middlewares=${ROUTER_PREFIX:-crs-tickets}-floci-tickets-https"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-crs-tickets}-floci-tickets-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-crs-tickets}-floci-tickets-https.redirectscheme.permanent=true"

networks:
  tickets-net:
    driver: bridge
    internal: true
  egress:
    driver: bridge
  dokploy-network:
    external: true
    name: dokploy-network

volumes:
  pgdata:
  redisdata:
  rabbitmq_data:
  uploads:
  floci-data:
  proxy_config:
  proxy_data:
  logs_api:
  logs_worker:
  logs_beat-worker:
  logs_migrator:
