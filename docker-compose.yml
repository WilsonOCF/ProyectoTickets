# =============================================================================
# Stack unificado: Plane (Community) + plane-mcp + Floci + Nuevo Ticket
# Destino: Dokploy (Compose) / docker compose local
#
# Red interna: tickets-net
# Comunicación servicio→servicio por nombre DNS de Compose (nunca localhost).
#
# Puertos públicos típicos (Dokploy suele mapear dominio → servicio):
#   - proxy          :80/:443  → UI Plane (web/admin/space/api vía reverse proxy)
#   - floci-tickets  :5179     → formulario Nuevo Ticket
#   - plane-mcp      :8211     → MCP HTTP (opcional exponer; tickets lo usa por red interna)
# =============================================================================

name: generador-tickets-integrado

x-db-env: &db-env
  PGHOST: ${PGHOST:-plane-db}
  PGDATABASE: ${PGDATABASE:-plane}
  POSTGRES_USER: ${POSTGRES_USER:-plane}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plane}
  POSTGRES_DB: ${POSTGRES_DB:-plane}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  PGDATA: ${PGDATA:-/var/lib/postgresql/data}

x-redis-env: &redis-env
  REDIS_HOST: ${REDIS_HOST:-plane-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-access-key}
  MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-secret-key}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ${AWS_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-access-key}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-secret-key}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}

x-proxy-env: &proxy-env
  APP_DOMAIN: ${APP_DOMAIN:-localhost}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  CERT_EMAIL: ${CERT_EMAIL:-}
  CERT_ACME_CA: ${CERT_ACME_CA:-}
  CERT_ACME_DNS: ${CERT_ACME_DNS:-}
  LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT:-80}
  LISTEN_HTTPS_PORT: ${LISTEN_HTTPS_PORT:-443}
  BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  SITE_ADDRESS: ${SITE_ADDRESS:-:80}

x-mq-env: &mq-env
  RABBITMQ_HOST: ${RABBITMQ_HOST:-plane-mq}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
  RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}

x-live-env: &live-env
  API_BASE_URL: ${API_BASE_URL:-http://api:8000}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:-change-me-live-secret}

x-app-env: &app-env
  WEB_URL: ${WEB_URL:-http://localhost}
  DEBUG: ${DEBUG:-0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
  USE_MINIO: ${USE_MINIO:-1}
  DATABASE_URL: ${DATABASE_URL:-postgresql://plane:plane@plane-db:5432/plane}
  SECRET_KEY: ${SECRET_KEY:-change-this-key-on-deployment}
  AMQP_URL: ${AMQP_URL:-amqp://plane:plane@plane-mq:5672/plane}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:-change-me-live-secret}
  WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}

services:
  # ---------------------------------------------------------------------------
  # Plane — datos
  # ---------------------------------------------------------------------------
  plane-db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    command: postgres -c 'max_connections=1000'
    environment:
      <<: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - tickets-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plane} -d ${POSTGRES_DB:-plane}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - tickets-net
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    environment:
      <<: *mq-env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - tickets-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  plane-minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    command: server /export --console-address ":9090"
    environment:
      <<: *minio-env
    volumes:
      - uploads:/export
    networks:
      - tickets-net

  # ---------------------------------------------------------------------------
  # Plane — aplicación (imágenes oficiales Community)
  # ---------------------------------------------------------------------------
  migrator:
    image: makeplane/plane-backend:${APP_RELEASE:-stable}
    restart: on-failure
    command: ./bin/docker-entrypoint-migrator.sh
    volumes:
      - logs_migrator:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
    networks:
      - tickets-net

  api:
    image: makeplane/plane-backend:${APP_RELEASE:-stable}
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api.sh
    volumes:
      - logs_api:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - tickets-net
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/instances/', timeout=5)",
        ]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s

  worker:
    image: makeplane/plane-backend:${APP_RELEASE:-stable}
    restart: unless-stopped
    command: ./bin/docker-entrypoint-worker.sh
    volumes:
      - logs_worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      api:
        condition: service_healthy
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
    networks:
      - tickets-net

  beat-worker:
    image: makeplane/plane-backend:${APP_RELEASE:-stable}
    restart: unless-stopped
    command: ./bin/docker-entrypoint-beat.sh
    volumes:
      - logs_beat-worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      api:
        condition: service_healthy
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
    networks:
      - tickets-net

  web:
    image: makeplane/plane-frontend:${APP_RELEASE:-stable}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    networks:
      - tickets-net

  space:
    image: makeplane/plane-space:${APP_RELEASE:-stable}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - tickets-net

  admin:
    image: makeplane/plane-admin:${APP_RELEASE:-stable}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - tickets-net

  live:
    image: makeplane/plane-live:${APP_RELEASE:-stable}
    restart: unless-stopped
    environment:
      <<: [*live-env, *redis-env]
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - tickets-net

  proxy:
    image: makeplane/plane-proxy:${APP_RELEASE:-stable}
    restart: unless-stopped
    environment:
      <<: *proxy-env
    ports:
      - "${LISTEN_HTTP_PORT:-80}:80"
      - "${LISTEN_HTTPS_PORT:-443}:443"
    volumes:
      - proxy_config:/config
      - proxy_data:/data
    depends_on:
      - web
      - api
      - space
      - admin
      - live
    networks:
      - tickets-net

  # ---------------------------------------------------------------------------
  # plane-mcp — habla con la API de Plane por red interna
  # ---------------------------------------------------------------------------
  plane-mcp:
    build:
      context: ./plane-mcp-server
      dockerfile: Dockerfile
    image: ${PLANE_MCP_IMAGE:-generador-tickets/plane-mcp:local}
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "8211"
      LOG_LEVEL: ${MCP_LOG_LEVEL:-info}
      LOG_PAYLOADS: ${MCP_LOG_PAYLOADS:-false}
      # Pública o canónica (Dokploy). Si solo usas API key interna, puede ser http://api:8000
      PLANE_BASE_URL: ${PLANE_BASE_URL:-http://api:8000}
      # Llamadas API container→container (preferido)
      PLANE_INTERNAL_BASE_URL: ${PLANE_INTERNAL_BASE_URL:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${MCP_HOST_PORT:-8211}:8211"
    expose:
      - "8211"
    networks:
      - tickets-net
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 5

  # ---------------------------------------------------------------------------
  # Floci — S3 local persistente (adjuntos del formulario)
  # ---------------------------------------------------------------------------
  floci:
    image: floci/floci:latest
    restart: unless-stopped
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_BASE_URL: http://floci:4566
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    volumes:
      - floci-data:/app/data
    expose:
      - "4566"
    networks:
      - tickets-net

  # ---------------------------------------------------------------------------
  # floci-tickets (Nuevo Ticket) — form + MCP + Floci + Plane
  # ---------------------------------------------------------------------------
  floci-tickets:
    build:
      context: ./nuevo-ticket
      dockerfile: Dockerfile
    image: ${FLOCI_TICKETS_IMAGE:-generador-tickets/floci-tickets:local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "5179"
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      # Interno: nombre DNS del servicio api en tickets-net
      PLANE_API_URL: ${PLANE_API_URL:-http://api:8000}
      # Público: URL que abre el usuario en el navegador (dominio Dokploy de Plane)
      PLANE_WEB_URL: ${PLANE_WEB_URL:?Set PLANE_WEB_URL (public Plane URL)}
      PLANE_WORKSPACE_SLUG: ${PLANE_WORKSPACE_SLUG:?Set PLANE_WORKSPACE_SLUG}
      # Interno: MCP en la misma red
      PLANE_MCP_URL: ${PLANE_MCP_URL:-http://plane-mcp:8211/http/api-key/mcp}
      PLANE_MCP_API_KEY: ${PLANE_MCP_API_KEY:?Set PLANE_MCP_API_KEY}
      # Interno: Floci (forzado; no uses localhost)
      FLOCI_ENDPOINT: http://floci:4566
      FLOCI_BUCKET: ${FLOCI_BUCKET:-tickets}
      AWS_REGION: ${FLOCI_AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${FLOCI_AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${FLOCI_AWS_SECRET_ACCESS_KEY:-test}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-auto}
      # HTTP local (:5179): debe ser false o el navegador no guarda nt_session
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # Si el formulario se sirve por HTTPS en Dokploy, usar https://... y SESSION_COOKIE_SECURE=true
      TICKETS_PUBLIC_URL: ${TICKETS_PUBLIC_URL:-http://localhost:5179}
    depends_on:
      api:
        condition: service_healthy
      plane-mcp:
        condition: service_healthy
      floci:
        condition: service_started
    ports:
      - "${TICKETS_HOST_PORT:-5179}:5179"
    expose:
      - "5179"
    networks:
      - tickets-net

networks:
  tickets-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  rabbitmq_data:
  uploads:
  floci-data:
  proxy_config:
  proxy_data:
  logs_api:
  logs_worker:
  logs_beat-worker:
  logs_migrator:
