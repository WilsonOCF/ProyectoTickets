# Dokploy: crear un servicio Compose con este archivo.
# Las variables privadas se introducen en Environment de Dokploy.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "5179"
      SESSION_SECRET: ${SESSION_SECRET:?Configura SESSION_SECRET}
      TICKETS_DATABASE_PATH: /app/data/portal.sqlite
      TICKETS_REGISTRATION_ENABLED: ${TICKETS_REGISTRATION_ENABLED:-true}
      PLANE_BRIDGE_URL: ${PLANE_BRIDGE_URL:?Usa el Compose raiz o configura el bridge privado}
      TICKETS_BRIDGE_SECRET: ${TICKETS_BRIDGE_SECRET:-${SESSION_SECRET}}
      PLANE_API_URL: ${PLANE_API_URL:?Configura PLANE_API_URL}
      PLANE_WEB_URL: ${PLANE_WEB_URL:?Configura PLANE_WEB_URL}
      PLANE_WORKSPACE_SLUG: ${PLANE_WORKSPACE_SLUG:?Configura PLANE_WORKSPACE_SLUG}
      PLANE_MCP_URL: ${PLANE_MCP_URL:?Configura PLANE_MCP_URL}
      PLANE_MCP_API_KEY: ${PLANE_MCP_API_KEY:?Configura PLANE_MCP_API_KEY}
      FLOCI_ENDPOINT: http://floci:4566
      FLOCI_BUCKET: ${FLOCI_BUCKET:-tickets}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-auto}
    expose:
      - "5179"
    volumes:
      - tickets-users:/app/data
    depends_on:
      - floci
  floci:
    image: floci/floci:latest
    restart: unless-stopped
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_BASE_URL: http://floci:4566
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    volumes:
      - floci-data:/app/data
volumes:
  tickets-users:
  floci-data:
